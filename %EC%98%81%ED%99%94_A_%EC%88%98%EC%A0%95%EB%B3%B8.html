<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크리스마스 영화 추천 티어리스트</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#23342e;background:#f8f5ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,.movie:focus-visible{outline:3px solid #cc9b3c;outline-offset:2px}.hero{background:#174b3c;color:white;padding:42px 20px 56px;text-align:center;position:relative;overflow:hidden}.hero:before{content:'✦  ✧    ✦       ✧   ✦';position:absolute;inset:15px 0 auto;opacity:.27;letter-spacing:25px;white-space:nowrap}.eyebrow{color:#ffdb9c;font-size:13px;letter-spacing:3px;font-weight:800}.hero h1{font-size:clamp(26px,4vw,46px);line-height:1.2;margin:12px 0}.hero p{color:#e1eee8;margin:0}.shell{max-width:1080px;margin:-28px auto 50px;padding:0 18px;position:relative}.panel{background:#fff;border:1px solid #e9e3d7;border-radius:20px;padding:22px;box-shadow:0 8px 30px #243f3010;margin-bottom:18px}.panel h2{margin:0 0 14px;font-size:20px}.intro{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.counter{font-size:14px;color:#576b61}.input-grid{display:grid;grid-template-columns:minmax(160px,2fr) minmax(115px,1fr) minmax(145px,1fr) auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:13px}.field input,.field select{height:43px;border:1px solid #d7ddd6;border-radius:10px;padding:0 11px;background:#fff;color:#23342e;min-width:0}.btn{background:#18634b;border:0;border-radius:10px;color:#fff;padding:11px 16px;font-weight:750;min-height:43px}.btn:hover{background:#0e4835}.btn.secondary{background:#f2f3f0;color:#37594a;border:1px solid #dce4dc}.btn.secondary:hover{background:#e6ece7}.btn.danger{background:#fff3f1;color:#a4372e;border:1px solid #efc7c1}.hint{font-size:12px;color:#66766e;margin:10px 0 0}.error{color:#b3332d;font-size:13px;min-height:18px;margin:8px 0 0}.tiers{display:flex;flex-direction:column;gap:10px}.tier{display:grid;grid-template-columns:145px minmax(0,1fr);border:1px solid #e6e7df;border-radius:15px;overflow:hidden;background:#fff;min-height:112px}.tier-label{padding:15px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:5px}.tier-label strong{font-size:30px;line-height:1}.tier-label span{font-size:12px;line-height:1.45}.tier[data-tier=S] .tier-label{background:#a92c36}.tier[data-tier=A] .tier-label{background:#c17b34}.tier[data-tier=B] .tier-label{background:#6f8560}.tier[data-tier=C] .tier-label{background:#667e9d}.tier[data-tier=unranked] .tier-label{background:#526960}.dropzone{padding:14px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:10px;min-height:110px}.tier.over{outline:3px dashed #bf9258;outline-offset:-4px;background:#fffbf3}.empty{color:#94a49a;font-size:14px}.movie{border:1px solid #e3e6df;border-radius:12px;background:#fff;box-shadow:0 3px 9px #26443810;min-width:165px;max-width:100%;padding:11px 12px;cursor:grab;text-align:left}.movie:hover{border-color:#a4b9aa;box-shadow:0 5px 14px #2644381c}.movie:active{cursor:grabbing}.movie-title{font-size:15px;font-weight:800;overflow-wrap:anywhere}.movie-meta{font-size:12px;color:#75847b;margin-top:5px}.movie-guide{font-size:11px;color:#9a8879;margin-top:7px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.foot{text-align:center;color:#7b877e;font-size:12px;padding:4px}dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100vw - 30px));max-height:90vh;box-shadow:0 25px 80px #0004}dialog::backdrop{background:#102a20a8}.modal-body{padding:24px}.modal-body h2{margin:0 0 8px}.modal-body p{font-size:13px;color:#67766b;line-height:1.5}.modal-fields{display:grid;gap:13px;margin:20px 0}.modal-actions{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap}.modal-actions .right{display:flex;gap:8px}.tier-picker{display:flex;gap:7px;flex-wrap:wrap}.tier-picker button{background:#edf2ee;border:1px solid #d9e2db;border-radius:9px;padding:8px 11px;font-weight:750;color:#315445}.tier-picker button[aria-pressed=true]{background:#215e49;color:#fff;border-color:#215e49}@media(max-width:760px){.input-grid{grid-template-columns:1fr 1fr}.input-grid .field:first-child{grid-column:1/-1}.input-grid>.btn{align-self:end}.tier{grid-template-columns:100px minmax(0,1fr)}.tier-label{padding:10px}.tier-label strong{font-size:25px}.tier-label span{font-size:11px}.dropzone{padding:9px}.movie{min-width:0;width:100%}}@media(max-width:430px){.input-grid{grid-template-columns:1fr}.input-grid .field:first-child{grid-column:auto}.hero{padding-bottom:48px}.panel{padding:16px}.tier{grid-template-columns:86px minmax(0,1fr)}.modal-actions{display:block}.modal-actions .right{margin-top:10px}.modal-actions .right button{flex:1}}
</style>
</head>
<body>
<header class="hero"><div class="eyebrow">✦ CHRISTMAS MOVIE NIGHT ✦</div><h1>🎄 크리스마스 영화 티어리스트</h1><p>크리스마스에 보기 좋은 영화, 나만의 추천 순위로 정리해요.</p></header>
<main class="shell">
<section class="panel" aria-labelledby="addHeading"><div class="intro"><h2 id="addHeading">영화 추가하기</h2><span class="counter" id="count">등록 영화 0편</span></div>
<form id="addForm" novalidate><div class="input-grid"><label class="field">영화 제목<input id="titleInput" type="text" maxlength="120" placeholder="예: 나 홀로 집에" autocomplete="off" required></label><label class="field">개봉 연도<input id="yearInput" type="number" min="1888" max="2100" placeholder="예: 1990" required></label><label class="field">장르<select id="genreInput" required><option value="">장르 선택</option><option>코미디</option><option>로맨스</option><option>드라마</option><option>가족</option><option>애니메이션</option><option>판타지</option><option>액션</option><option>SF</option><option>스릴러</option><option>공포</option><option>기타</option></select></label><button class="btn" type="submit">+ 영화 추가</button></div><p id="formError" class="error" role="alert"></p></form><p class="hint">영화 카드를 끌어 등급 칸에 놓거나, 카드를 클릭해 등급을 선택할 수 있어요.</p></section>
<section class="panel" aria-labelledby="rankHeading"><div class="panel-heading"><h2 id="rankHeading">나의 크리스마스 추천 순위</h2><button class="btn danger" id="resetButton" type="button">전체 초기화</button></div><div class="tiers" id="tiers"></div></section>
<p class="foot">이 페이지의 목록은 현재 브라우저에만 저장돼요. 다른 컴퓨터와 자동 공유되지 않습니다.</p>
</main>
<dialog id="editDialog" aria-labelledby="editHeading"><div class="modal-body"><h2 id="editHeading">영화 정보와 등급</h2><p>정보를 바꾸거나, 원하는 등급을 선택해 주세요.</p><form id="editForm" novalidate><div class="modal-fields"><label class="field">영화 제목<input id="editTitle" type="text" maxlength="120" required></label><label class="field">개봉 연도<input id="editYear" type="number" min="1888" max="2100" required></label><label class="field">장르<select id="editGenre" required></select></label><div class="field"><span>추천 등급</span><div class="tier-picker" id="tierPicker" role="group" aria-label="추천 등급 선택"></div></div></div><p id="editError" class="error" role="alert"></p><div class="modal-actions"><button type="button" class="btn danger" id="deleteButton">영화 삭제</button><div class="right"><button type="button" class="btn secondary" id="cancelButton">취소</button><button type="submit" class="btn">변경 저장</button></div></div></form></div></dialog>
<script>
(()=>{'use strict';
const STORAGE_KEY='christmas-tier-list-a-v1';
const tiers=[{id:'S',label:'꼭 봐야 하는 영화'},{id:'A',label:'보기 좋은 영화'},{id:'B',label:'괜찮지만 분위기는 보통'},{id:'C',label:'굳이 추천하지 않는 영화'},{id:'unranked',label:'아직 등급을 정하지 않은 영화'}];
const $=id=>document.getElementById(id);let movies=[];let currentId=null;let editingTier='unranked';let storageAvailable=true;
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=JSON.parse(raw);if(!Array.isArray(data))return;movies=data.filter(m=>m&&typeof m.id==='string'&&typeof m.title==='string'&&tiers.some(t=>t.id===m.tier)).map(m=>({id:m.id,title:m.title,year:String(m.year||''),genre:String(m.genre||'기타'),tier:m.tier}));}catch(e){console.warn('저장된 데이터를 읽을 수 없습니다.',e);storageAvailable=false;}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));storageAvailable=true;}catch(e){storageAvailable=false;alert('브라우저 저장이 제한되어 변경 내용이 다시 열 때 유지되지 않을 수 있어요.');}}
function el(tag,cls,txt){const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node;}
function render(){const root=$('tiers');root.replaceChildren();for(const tier of tiers){const section=el('section','tier');section.dataset.tier=tier.id;const name=el('div','tier-label');name.append(el('strong','',tier.id==='unranked'?'미분류':tier.id),el('span','',tier.label));const zone=el('div','dropzone');zone.setAttribute('aria-label',tier.id==='unranked'?'미분류 영역':tier.id+'등급 영역');const entries=movies.filter(m=>m.tier===tier.id);if(!entries.length)zone.append(el('span','empty','영화를 이곳으로 옮겨 주세요'));for(const movie of entries){const card=el('button','movie');card.type='button';card.draggable=true;card.title='클릭하여 영화 정보 또는 등급 변경';card.append(el('div','movie-title',movie.title),el('div','movie-meta',movie.year+' · '+movie.genre),el('div','movie-guide','클릭해서 등급 변경 · 드래그 가능'));card.addEventListener('click',()=>openEdit(movie.id));card.addEventListener('dragstart',event=>{event.dataTransfer.setData('text/plain',movie.id);event.dataTransfer.effectAllowed='move';});zone.append(card);}section.append(name,zone);section.addEventListener('dragover',event=>{if(event.dataTransfer.types.includes('text/plain')){event.preventDefault();section.classList.add('over');event.dataTransfer.dropEffect='move';}});section.addEventListener('dragleave',event=>{if(!section.contains(event.relatedTarget))section.classList.remove('over');});section.addEventListener('drop',event=>{event.preventDefault();section.classList.remove('over');const id=event.dataTransfer.getData('text/plain');const movie=movies.find(m=>m.id===id);if(movie){movie.tier=tier.id;save();render();}});root.append(section);}$('count').textContent='등록 영화 '+movies.length+'편';}
function valid(title,year,genre){if(!title.trim())return '영화 제목을 입력해 주세요.';if(!/^\d{4}$/.test(String(year))||Number(year)<1888||Number(year)>2100)return '개봉 연도는 1888~2100 사이의 네 자리 숫자로 입력해 주세요.';if(!genre)return '장르를 선택해 주세요.';return '';}
$('addForm').addEventListener('submit',event=>{event.preventDefault();const title=$('titleInput').value.trim(),year=$('yearInput').value,genre=$('genreInput').value;const error=valid(title,year,genre);$('formError').textContent=error;if(error)return;movies.push({id:(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),title,year,genre,tier:'unranked'});save();render();$('addForm').reset();$('titleInput').focus();});
const genres=$('genreInput');$('editGenre').replaceChildren(...Array.from(genres.options).map(option=>option.cloneNode(true)));
function drawPicker(){const picker=$('tierPicker');picker.replaceChildren();for(const tier of tiers){const button=el('button','',tier.id==='unranked'?'미분류':tier.id);button.type='button';button.setAttribute('aria-pressed',String(editingTier===tier.id));button.addEventListener('click',()=>{editingTier=tier.id;drawPicker();});picker.append(button);}}
function openEdit(id){const movie=movies.find(m=>m.id===id);if(!movie)return;currentId=id;editingTier=movie.tier;$('editTitle').value=movie.title;$('editYear').value=movie.year;$('editGenre').value=movie.genre;$('editError').textContent='';drawPicker();$('editDialog').showModal();}
function closeEdit(){$('editDialog').close();currentId=null;}
$('cancelButton').addEventListener('click',closeEdit);$('editDialog').addEventListener('close',()=>{currentId=null;});
$('editForm').addEventListener('submit',event=>{event.preventDefault();const movie=movies.find(m=>m.id===currentId);if(!movie)return;const title=$('editTitle').value.trim(),year=$('editYear').value,genre=$('editGenre').value;const error=valid(title,year,genre);$('editError').textContent=error;if(error)return;Object.assign(movie,{title,year,genre,tier:editingTier});save();render();closeEdit();});
$('deleteButton').addEventListener('click',()=>{const movie=movies.find(m=>m.id===currentId);if(!movie)return;if(!confirm('「'+movie.title+'」 영화를 삭제할까요?'))return;movies=movies.filter(m=>m.id!==currentId);save();render();closeEdit();});
$('resetButton').addEventListener('click',()=>{if(!confirm('등록된 모든 영화와 등급을 삭제하고 빈 목록으로 초기화할까요?'))return;movies=[];save();render();});
load();render();
})();
</script>
</body>
</html>
